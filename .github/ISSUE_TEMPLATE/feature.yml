name: Feature
description: A change you want in Sparksi
body:
  - type: markdown
    attributes:
      value: |
        Leave site details out. Use `spark-a`, `spark-b`, `100.64.0.x`, `192.0.2.x`, and `/home/USER`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want to change, and how it should behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, if any.
