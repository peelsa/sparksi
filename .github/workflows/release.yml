name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the sdist and wheel, and skip the GitHub release and the PyPI publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches pyproject.toml
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          current = None
          found = ""
          for raw in Path("pyproject.toml").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if line.startswith("[") and line.endswith("]"):
                  current = line[1:-1].strip()
                  continue
              if current != "project":
                  continue
              match = re.match(r'version\s*=\s*"([^"]+)"', line)
              if match:
                  found = match.group(1)
                  break
          if not found:
              sys.exit("pyproject.toml has no project version")
          if found != version:
              sys.exit(f"tag {version} does not match pyproject.toml version {found}")
          PY

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install build
          python -m build
          test -n "$(find dist -name 'sparksi-*.whl' -print -quit)"
          test -n "$(find dist -name 'sparksi-*.tar.gz' -print -quit)"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Dry run
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        run: |
          echo "dry run: built dist and skipped the GitHub release and the PyPI publish"

  pypi:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sparksi/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  github-release:
    needs: pypi
    if: ${{ needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Notes from the changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(f"tag {tag} is not a version")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"(?ms)^## {re.escape(version)}\b.*?(?=^## |\Z)", text)
          if not match:
              sys.exit(f"CHANGELOG.md has no {version} section")
          Path("release-notes.md").write_text(match.group(0).strip() + "\n", encoding="utf-8")
          PY

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --notes-file release-notes.md
